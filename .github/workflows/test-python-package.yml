name: test

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
    - ver/*
    tags:
    - v*

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15-dev']
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        cache: pip
        python-version: ${{ matrix.python-version }}
    - name: Install package
      run: pip install --requirement ./tests/requirements.txt black pytest .
    - name: Run test suite
      run: pytest -vvra
    - name: Lint with black
      run: black --check ./src
